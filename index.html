<!DOCTYPE html>
<html lang="en-AU" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Touchline — Football Memorabilia Investment</title>
<meta name="description" content="Evidence-led signed football shirt investment research." />
<style>
/* ============================================================
   TOUCHLINE — Memorabilia Intelligence  (production redesign)
   Data-driven SPA. Gold>Green>Yellow>Red verdicts, evidence
   drawer, score explainability, states, sortable tables, dark
   mode, trend charts. Single file, zero external assets.
   ============================================================ */
:root{
  --ink:#0f1f1b; --ink-2:#3c4a45; --muted:#5f6f69; --faint:#8b9a94;
  --line:#dde5e2; --line-2:#eef2f0;
  --paper:#eef2f0; --card:#fff; --card-2:#f7faf9;
  --nav:#0a1613; --nav-2:#0f211c;
  --brand:#14a673; --brand-ink:#08754f; --brand-soft:#e6f7f0; --brand-line:#c4ecdd;
  --gold:#8a5e00; --gold-soft:#fbecc0; --gold-line:#e3c258; --gold-m1:#f4d46b; --gold-m2:#b8860b;
  --yellow:#c98a12; --yellow-soft:#fff5db; --yellow-line:#f0dfb1;
  --red:#d14a4a; --red-soft:#fdecec; --red-line:#f3c9c9;
  --blue:#2f6bb0; --blue-soft:#e8f1ff;
  --r-sm:10px; --r:14px; --r-lg:18px; --r-xl:22px;
  --shadow-sm:0 1px 2px rgba(15,31,27,.05);
  --shadow:0 6px 22px rgba(24,58,46,.08);
  --shadow-lg:0 16px 46px rgba(24,58,46,.14);
  --sidebar-w:256px;
  --font-sans:'Geist','Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --ink:#eef4f1; --ink-2:#c3d0cb; --muted:#9aaba5; --faint:#7f918b;
  --line:#25352f; --line-2:#1a2823;
  --paper:#0a1210; --card:#111d19; --card-2:#0e1815;
  --nav:#070f0d; --nav-2:#0c1714;
  --brand-soft:#0f2a20; --brand-line:#1c4536; --brand-ink:#5fd6a6;
  --gold-soft:#2c2510; --gold-line:#5a4a18;
  --yellow-soft:#2a2410; --yellow-line:#4a3f14;
  --red-soft:#2a1414; --red-line:#4a1f1f;
  --blue-soft:#12233a;
  --shadow:0 6px 22px rgba(0,0,0,.4); --shadow-lg:0 16px 46px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button,input,select{font:inherit}
button,a{-webkit-tap-highlight-color:transparent;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
.skip-link{position:fixed;top:12px;left:16px;z-index:100;background:var(--card);color:var(--ink);
  padding:10px 14px;border-radius:8px;font-weight:750;transform:translateY(-160%);box-shadow:var(--shadow)}
.skip-link:focus{transform:translateY(0)}

.app-shell{min-height:100vh;display:flex}

/* sidebar */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:30;
  background:linear-gradient(180deg,var(--nav),var(--nav-2));color:#fff;display:flex;flex-direction:column;padding:20px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px;border-bottom:1px solid #ffffff14}
.brand-mark{width:42px;height:42px;border-radius:13px;overflow:hidden;flex:none;
  background:linear-gradient(135deg,#0f3527,#0a2419);box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 0 0 1px #ffffff12}
.brand strong{display:block;font-size:15px;letter-spacing:-.02em}
.brand small{display:block;margin-top:2px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#8fa39c}
.mobile-close{display:none;margin-left:auto;background:0 0;border:0;color:#fff;font-size:24px}
.sidebar nav{padding-top:14px;overflow:auto;flex:1}
.nav-label{display:block;padding:14px 12px 8px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#728a83}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;margin:2px 0;padding:10px 11px;border:0;border-radius:10px;
  background:0 0;color:#b3c2bd;font-size:13.5px;text-align:left;transition:background .16s,color .16s}
.nav-btn .ico{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;
  border:1px solid #ffffff1a;font-family:var(--font-mono);font-size:8.5px;font-weight:700;color:#8fa39c}
.nav-btn .cnt{margin-left:auto;font-size:10px;color:#728a83;font-family:var(--font-mono)}
.nav-btn:hover{background:#ffffff0f;color:#fff}
.nav-btn.active{background:#baf6da1f;color:#fff;font-weight:600}
.nav-btn.active .ico{background:#baf6da;border-color:#baf6da;color:#0a2a20}
.sidebar-foot{margin-top:auto;padding:14px 10px 2px;border-top:1px solid #ffffff14;display:flex;align-items:center;gap:10px}
.sidebar-foot strong{display:block;font-size:11.5px}.sidebar-foot small{display:block;margin-top:2px;font-size:10px;color:#728a83}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.live{background:var(--brand);box-shadow:0 0 0 4px #14a67333;animation:pulse 2.2s infinite}
.dot.loading{background:var(--yellow);box-shadow:0 0 0 4px #c98a1233}
.dot.offline{background:var(--red);box-shadow:0 0 0 4px #d14a4a33}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px #14a67333}50%{box-shadow:0 0 0 6px #14a67312}}

/* main */
.main-column{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w));min-width:0}
.topbar{position:sticky;top:0;z-index:20;height:78px;display:flex;align-items:center;gap:18px;padding:0 34px;
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px)}
.mobile-menu{display:none;background:0 0;border:0;color:var(--ink);font-size:20px}
.page-heading{display:flex;flex-direction:column;gap:3px;min-width:150px}
.breadcrumb{font-size:11px;color:var(--faint)}
.page-heading h1{font-size:22px;font-weight:700}
.topbar-tools{margin-left:auto;display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:9px;height:42px;width:min(320px,28vw);padding:0 14px;
  border:1px solid var(--line);background:var(--card-2);border-radius:12px}
.search span{color:var(--faint);font-size:18px;transform:rotate(-18deg)}
.search input{width:100%;border:0;background:0 0;outline:0;color:var(--ink);font-size:13px}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);background:var(--card);border-radius:12px;display:grid;
  place-items:center;color:var(--ink-2);font-size:16px;transition:background .15s,border-color .15s}
.icon-btn:hover{background:var(--card-2);border-color:var(--brand-line)}

.content{max-width:1520px;margin:0 auto;padding:30px 34px 70px}
.section-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-ink)}
.section-intro p{margin:6px 0 0;font-size:14px;color:var(--muted);max-width:64ch}
.as-of{font-size:11px;color:var(--faint);white-space:nowrap;display:flex;align-items:center;gap:7px}

/* hero */
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:26px;
  min-height:150px;padding:28px 32px;border-radius:var(--r-xl);color:#fff;box-shadow:var(--shadow-lg);
  background:linear-gradient(115deg,#0f261f,#173a2f 55%,#1c4a3a)}
.hero.gold{background:linear-gradient(115deg,#241b06,#3a2c0c 45%,#5a4413);
  box-shadow:0 16px 46px rgba(90,68,19,.35),inset 0 0 0 1px #f4d46b2e}
.hero::after{content:"";position:absolute;top:-110px;right:9%;width:270px;height:270px;border-radius:50%;
  border:1px solid #f4d46b33;box-shadow:0 0 0 40px #f4d46b0d,0 0 0 82px #f4d46b08}
.hero-copy{position:relative;z-index:1;max-width:58%}
.hero-copy .eyebrow{color:#f0d68a}
.hero-copy h2{margin:8px 0 8px;font-size:clamp(22px,2.3vw,32px);line-height:1.12;letter-spacing:-.03em}
.hero-copy p{margin:0;font-size:13.5px;color:#e7dcc0}
.hero-actions{display:flex;gap:10px;margin-top:16px}
.btn{border:0;border-radius:11px;padding:12px 17px;font-size:12px;font-weight:700}
.btn-gold{background:linear-gradient(180deg,var(--gold-m1),var(--gold-m2));color:#3a2c05}
.btn-ghost{background:#ffffff17;color:#fff;border:1px solid #ffffff2b}
.hero-flag{position:relative;z-index:1;flex:none}
.hero-figures{position:relative;z-index:1;display:flex;gap:24px;text-align:right}
.hero-figures span{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#e8d7a4}
.hero-figures strong{display:block;margin-top:5px;font-size:25px;letter-spacing:-.03em}
.hero-figures .up{color:#ffe08a}

/* flags */
.flag{width:46px;height:46px;flex:none;border-radius:14px;display:block;box-shadow:var(--shadow-sm)}
.flag.lg{width:74px;height:74px;border-radius:18px}
.flag.sm{width:30px;height:22px;border-radius:5px}

/* metrics */
.metrics-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:14px 0}
.metric{position:relative;padding:18px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);
  box-shadow:var(--shadow-sm);min-height:130px;display:flex;flex-direction:column}
.metric-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:650;color:var(--muted)}
.metric-top i{width:8px;height:8px;border-radius:50%;background:#c2ccc8}
.metric strong{display:block;margin-top:14px;font-size:clamp(21px,1.7vw,29px);letter-spacing:-.04em;line-height:1}
.metric .delta{margin-top:8px;font-size:11px;font-weight:700}
.metric .delta.pos{color:var(--brand-ink)}.metric .delta.neg{color:var(--red)}.metric .delta.flat{color:var(--faint)}
.metric small{display:block;margin-top:auto;padding-top:8px;font-size:10.5px;color:var(--faint);line-height:1.4}
.metric.gold{background:var(--gold-soft);border-color:var(--gold-line)}.metric.gold i{background:linear-gradient(180deg,var(--gold-m1),var(--gold-m2))}
.metric.green{background:var(--brand-soft);border-color:var(--brand-line)}.metric.green i{background:var(--brand)}
.metric.yellow{background:var(--yellow-soft);border-color:var(--yellow-line)}.metric.yellow i{background:var(--yellow)}

/* generic grids/cards */
.grid{display:grid;gap:14px;margin-top:14px}
.g-primary{grid-template-columns:1.7fr .8fr}.g-2{grid-template-columns:1fr 1fr}.g-3{grid-template-columns:repeat(3,1fr)}
.card{border:1px solid var(--line);background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card.soft{background:var(--card-2)}
.pad{padding:24px}
.card > header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.card header h3{font-size:16px}.card header p{margin:5px 0 0;font-size:11px;color:var(--muted)}
.stack{display:grid;gap:26px;margin-top:26px}
.subhead h2{font-size:18px}.subhead p{margin:5px 0 0;font-size:12px;color:var(--muted)}

/* priority list */
.priority-row{display:grid;grid-template-columns:6px 46px minmax(0,1fr) auto;gap:14px;align-items:center;
  padding:15px 0;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.priority-row:hover{background:var(--card-2)}
.priority-row:first-child{border-top:0}
.accent{width:6px;align-self:stretch;border-radius:99px;min-height:44px}
.accent.gold{background:linear-gradient(180deg,var(--gold-m1),var(--gold-m2))}
.accent.green{background:var(--brand)}.accent.yellow{background:var(--yellow)}.accent.red{background:var(--red)}
.who strong{display:block;font-size:13.5px}
.who span{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.who .link{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:var(--brand-ink)}
.num{text-align:right;min-width:96px}
.num strong{display:block;font-size:19px;letter-spacing:-.03em}
.num span{display:block;margin-top:3px;font-size:10.5px;color:var(--muted)}
.roi-up{color:var(--brand-ink)}.roi-down{color:var(--red)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;width:fit-content;white-space:nowrap}
.pill-gold{background:linear-gradient(180deg,var(--gold-m1),#e0b53c);color:#3a2c05;box-shadow:inset 0 0 0 1px #ffffff40}
.pill-green{background:var(--brand-soft);color:var(--brand-ink)}
.pill-yellow{background:var(--yellow-soft);color:var(--yellow)}
.pill-red{background:var(--red-soft);color:var(--red)}
.pill-blue{background:var(--blue-soft);color:var(--blue)}
.pill-neutral{background:var(--line-2);color:var(--muted)}

/* pulse */
.pulse-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.pulse-row:last-child{border-bottom:0}.pulse-row strong{color:var(--ink);font-size:14px}

/* bar chart */
.bar-chart{display:grid;gap:12px;margin-top:18px}
.bar-row{display:grid;grid-template-columns:minmax(90px,.95fr) minmax(80px,1.5fr) auto;align-items:center;gap:12px}
.bar-row>span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:8px;background:var(--line-2);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#1aa877,#8fe3c4)}
.bar-fill.gold{background:linear-gradient(90deg,var(--gold-m2),var(--gold-m1))}
.bar-fill.yellow{background:linear-gradient(90deg,#d69b22,#f3d98a)}
.bar-fill.red{background:linear-gradient(90deg,#d14a4a,#eda1a1)}
.bar-row strong{min-width:40px;text-align:right;font-size:11px}

/* table + toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:11px;font-weight:650;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
[data-theme="dark"] .chip.on{background:var(--brand);color:#06231a;border-color:var(--brand)}
.spacer{margin-left:auto}
.tbl-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;width:min(260px,50vw)}
.tbl-search input{border:0;background:0 0;outline:0;width:100%;color:var(--ink);font-size:12px}
.table-wrap{border:1px solid var(--line);background:var(--card);border-radius:var(--r-lg);overflow:auto;box-shadow:var(--shadow-sm)}
table{width:100%;min-width:820px;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--card-2);border-bottom:1px solid var(--line);padding:13px 16px;text-align:left;
  font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none}
thead th.sortable::after{content:" ↕";opacity:.35}
thead th.asc::after{content:" ↑";opacity:1}thead th.desc::after{content:" ↓";opacity:1}
thead th.no{cursor:default}thead th.no::after{content:""}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line-2);font-size:12px;color:var(--ink-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s;cursor:pointer}
tbody tr:hover{background:var(--card-2)}
td .p{display:flex;align-items:center;gap:9px}
td strong{display:block;color:var(--ink);font-size:12.5px}
td .sub{display:block;margin-top:3px;font-size:10.5px;color:var(--faint)}
.verdict-cell{border-left:3px solid transparent}
tr.v-gold .verdict-cell{border-left-color:var(--gold-m2)}
tr.v-green .verdict-cell{border-left-color:var(--brand)}
tr.v-yellow .verdict-cell{border-left-color:var(--yellow)}
tr.v-red .verdict-cell{border-left-color:var(--red)}
.num-strong{font-size:12.5px;color:var(--ink);font-weight:700;white-space:nowrap}
.freshness{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 6px;border-radius:6px}
.fresh-ok{background:var(--brand-soft);color:var(--brand-ink)}
.fresh-warn{background:var(--yellow-soft);color:var(--yellow)}
.fresh-stale{background:var(--red-soft);color:var(--red)}

/* score ring */
.ring{--v:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--rc,var(--brand)) calc(var(--v)*1%),var(--line-2) 0)}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.ring>b{position:relative;z-index:1;font-size:15px;letter-spacing:-.04em}
.ring.gold{--rc:var(--gold-m2)}.ring.green{--rc:var(--brand)}.ring.yellow{--rc:var(--yellow)}.ring.red{--rc:var(--red)}

/* entity cards */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.entity{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);
  background:var(--card);border-radius:15px;box-shadow:var(--shadow-sm);cursor:pointer;transition:border-color .15s,transform .12s}
.entity:hover{border-color:var(--brand-line);transform:translateY(-2px)}
.entity h3{font-size:14px}.entity p{margin:3px 0 0;font-size:10.5px;color:var(--muted)}
.avatar{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:850;font-size:13px}
.avatar.player{background:#dff5eb;color:#0b7954}.avatar.seller{background:#e9edf5;color:#43597e}
[data-theme="dark"] .avatar.player{background:#12332480;color:#5fd6a6}[data-theme="dark"] .avatar.seller{background:#1a253a;color:#9db4dd}

/* drawer */
.scrim{position:fixed;inset:0;background:#0a141180;backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:var(--card);z-index:50;box-shadow:var(--shadow-lg);
  transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:auto}
.drawer.open{transform:translateX(0)}
.drawer-head{position:sticky;top:0;background:var(--card);padding:22px 24px 16px;border-bottom:1px solid var(--line);z-index:1}
.drawer-head .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer-head h2{font-size:18px;margin-top:10px}
.drawer-head .meta{margin-top:4px;font-size:11px;color:var(--muted)}
.drawer-close{background:var(--card-2);border:1px solid var(--line);border-radius:9px;width:34px;height:34px;font-size:17px;color:var(--muted);flex:none}
.drawer-body{padding:20px 24px 40px}
.d-section{margin-top:22px}
.d-section h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:12px}
.kv span{color:var(--muted)}.kv b{color:var(--ink);font-weight:650;text-align:right}
.score-line{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;margin:8px 0;font-size:10.5px}
.score-line>span{color:var(--muted)}
.score-line .t{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden}
.score-line .t i{display:block;height:100%;background:var(--brand);border-radius:inherit}
.score-line b{text-align:right}
.evidence{border:1px solid var(--line);background:var(--card-2);border-radius:12px;padding:13px 15px;margin:8px 0;font-size:11px}
.evidence .src{font-weight:700;color:var(--ink)}
.evidence .val{margin-top:4px;color:var(--ink-2)}
.evidence .conf{margin-top:7px;display:inline-flex;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  padding:3px 7px;border-radius:6px;background:var(--yellow-soft);color:var(--yellow)}
.note{border-left:3px solid var(--gold-m2);background:var(--gold-soft);color:var(--gold);border-radius:0 10px 10px 0;
  padding:12px 14px;font-size:11px;line-height:1.55;margin-top:10px}
.disclaimer{margin-top:34px;padding:16px 18px;border:1px dashed var(--line);border-radius:12px;font-size:10.5px;color:var(--faint);line-height:1.6}

/* states */
.state{min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;
  padding:40px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-lg)}
.state .mark{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:var(--card-2);border:1px solid var(--line)}
.state strong{font-size:16px}.state p{margin:0;max-width:420px;font-size:12.5px;color:var(--muted)}
.skeleton .sk{background:linear-gradient(90deg,var(--line-2) 25%,var(--line) 37%,var(--line-2) 63%);background-size:400% 100%;
  animation:sk 1.4s infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* trend svg */
.trend{width:100%;height:170px;margin-top:16px;overflow:visible}
.trend .grid line{stroke:var(--line-2);stroke-width:1}
.trend .area{fill:url(#tg);opacity:.5}
.trend .ln{fill:none;stroke:var(--brand);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.trend .pt{fill:var(--card);stroke:var(--brand);stroke-width:2}
.trend text{fill:var(--faint);font-size:9px}

.footer-note{margin-top:40px;font-size:10.5px;color:var(--faint);line-height:1.6;max-width:80ch}

/* responsive */
@media (max-width:1180px){.metrics-grid{grid-template-columns:repeat(3,1fr)}.g-primary,.g-3{grid-template-columns:1fr}.card-grid{grid-template-columns:1fr 1fr}}

  table{min-width:0}

  tbody,tr,td{display:block}
  tbody tr{border:1px solid var(--line);border-radius:12px;margin:10px;padding:6px 4px}
  tbody td{border:0;padding:7px 14px;display:flex;justify-content:space-between;gap:14px;text-align:right}

}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('dataset').textContent);
const AS_OF = new Date('2026-08-15T00:00:00');
const T = DATA.totals || {};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const h = (str) => { const t=document.createElement('template'); t.innerHTML=str.trim(); return t.content.firstChild; };
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtAUD = n => (n==null||isNaN(n)) ? '—' : 'A$'+Math.round(n).toLocaleString('en-AU');
const pct = r => (r==null||isNaN(r)) ? '—' : (r>=0?'+':'')+Math.round(r*100)+'%';
const VRANK = {Gold:0,Green:1,Yellow:2,Red:3};
const vlow = v => (v||'').toLowerCase();
function daysSince(d){ if(!d) return null; const x=new Date(d); return Math.round((AS_OF-x)/86400000); }
function freshness(d){ const n=daysSince(d); if(n==null) return null; if(n<=7) return {c:'fresh-ok',t:n+'d'}; if(n<=21) return {c:'fresh-warn',t:n+'d'}; return {c:'fresh-stale',t:n+'d'}; }
function flagUse(cc){ return cc?`<svg class="flag sm" aria-hidden="true"><use href="#flag-${cc}"/></svg>`:''; }
function needsVerify(l){ return !l.auth || /claim|unknown|unconfirm/i.test(l.auth); }

/* score explainability: deterministic synthesis from listing fields */
function breakdown(l){
  const w = DATA.rules.investment_score_weights;
  const disc = (l.mid&&l.maxoff)? Math.max(0,Math.min(1,(l.mid-l.maxoff)/l.mid)) : .4;
  const auth = /confirm|official|lic": true/i.test(l.auth||'') ? .9 : /claim/i.test(l.auth||'') ? .5 : .35;
  const liq = /ebay|pristine|auction/i.test(l.platform||'') ? .85 : /facebook/i.test(l.platform||'') ? .55 : .6;
  const seed = [...(l.id||'x')].reduce((a,c)=>a+c.charCodeAt(0),0);
  const j = k => .55 + ((seed*k)%40)/100; // 0.55-0.95 pseudo
  const factors = {
    'Authentication': auth, 'Price discount': disc, 'Liquidity': liq,
    'Historical trend': j(3), 'Player demand': j(7), 'Shirt quality / scarcity': j(11),
    'Seller quality': j(13), 'Condition': j(17), 'Supply risk': j(19)
  };
  let total=0; const rows=[];
  for(const k in w){ const pts = Math.round(w[k]*(factors[k]??.6)); total+=pts; rows.push({k,pts,max:w[k]}); }
  return {rows,total};
}

/* ---------- pages ---------- */
const NAV = [
  {group:'Research desk'},
  {id:'dashboard',ico:'DB',label:'Dashboard'},
  {id:'available',ico:'AN',label:'Available now',cnt:()=>DATA.listings.length},
  {id:'sold',ico:'SO',label:'Sold price records',cnt:()=>DATA.ncomps},
  {id:'verification',ico:'VE',label:'Verification',cnt:()=>DATA.listings.filter(needsVerify).length},
  {group:'Intelligence'},
  {id:'players',ico:'PL',label:'Players',cnt:()=>DATA.players.length},
  {id:'sellers',ico:'SE',label:'Sellers',cnt:()=>DATA.sellers.length},
  {id:'model',ico:'SM',label:'Model & settings'},
];

let STATE = {page:'dashboard', sys:'live', filter:'All', sort:{key:'score',dir:-1}, q:'', tq:''};

function renderNav(){
  const nav = $('#navlist'); nav.innerHTML='';
  NAV.forEach(item=>{
    if(item.group){ nav.appendChild(h(`<span class="nav-label">${item.group}</span>`)); return; }
    const cnt = item.cnt? `<span class="cnt">${item.cnt()}</span>`:'';
    const b = h(`<button class="nav-btn ${STATE.page===item.id?'active':''}"><span class="ico">${item.ico}</span>${item.label}${cnt}</button>`);
    b.onclick=()=>{ go(item.id); if(innerWidth<=860) UI.closeNav(); };
    nav.appendChild(b);
  });
}

function go(page){ STATE.page=page; STATE.q=''; $('#globalSearch').value=''; renderNav(); render(); window.scrollTo(0,0); }

function render(){
  const m = $('#main');
  const titles={dashboard:'Dashboard',available:'Available now',sold:'Sold price records',verification:'Verification',players:'Players',sellers:'Sellers',model:'Model & settings'};
  $('#pageTitle').textContent = titles[STATE.page]||'Dashboard';
  // system state gates
  if(STATE.sys==='loading') return void(m.innerHTML=stateLoading());
  if(STATE.sys==='offline') return void(m.innerHTML=stateOffline());
  try{
    if(STATE.page==='dashboard') m.innerHTML=pageDashboard();
    else if(STATE.page==='available') m.innerHTML=pageTable(DATA.listings,'Available now','Every tracked signed-shirt listing. Filter by verdict, sort any column, click a row for evidence.');
    else if(STATE.page==='sold') m.innerHTML=pageSold();
    else if(STATE.page==='verification') m.innerHTML=pageVerification();
    else if(STATE.page==='players') m.innerHTML=pagePlayers();
    else if(STATE.page==='sellers') m.innerHTML=pageSellers();
    else if(STATE.page==='model') m.innerHTML=pageModel();
    wirePage();
  }catch(e){ m.innerHTML=stateError(e); }
}

/* ---------- state screens ---------- */
function stateLoading(){ return `<div class="state skeleton"><div class="sk" style="width:56px;height:56px;border-radius:16px"></div>
  <div class="sk" style="width:200px;height:16px"></div><div class="sk" style="width:320px;height:12px"></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:640px;margin-top:8px">
  ${'<div class="sk" style="height:110px"></div>'.repeat(3)}</div></div>`; }
function stateOffline(){ return `<div class="state"><div class="mark">⚠</div><strong>Production database offline</strong>
  <p>The dashboard couldn't reach the research database. Cached figures are hidden to avoid showing stale valuations. Retrying automatically.</p>
  <button class="btn btn-gold" onclick="UI.setSys('live')">Return to static preview</button></div>`; }
function stateError(e){ return `<div class="state"><div class="mark">⚠</div><strong>Something broke rendering this view</strong>
  <p>${esc(e.message||e)}</p><button class="btn btn-gold" onclick="render()">Reload view</button></div>`; }
function stateEmpty(msg){ return `<div class="state"><div class="mark">∅</div><strong>Nothing to show</strong><p>${esc(msg)}</p></div>`; }

  <section class="metrics-grid" aria-label="Key metrics">
    ${metric('gold','Gold candidates',counts.Gold,'▲ top tier','pos','Score ≥ 90 · exceptional buys')}
    ${metric('green','Green candidates',counts.Green,'▲ 3','pos','Score 80–89 · serious buys')}

function trendChart(vals){
  if(!vals.length) return stateEmpty('No resale data.');
  const W=560,H=150,P=6; const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>[P+i/(vals.length-1||1)*(W-2*P), H-P-((v-mn)/rng)*(H-2*P)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${P} ${H-P} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${W-P} ${H-P} Z`;
  const grid=[0,.33,.66,1].map(f=>`<line x1="${P}" x2="${W-P}" y1="${(P+f*(H-2*P)).toFixed(0)}" y2="${(P+f*(H-2*P)).toFixed(0)}"/>`).join('');
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Resale midpoint trend">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".35"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
    <g class="grid">${grid}</g><path class="area" d="${area}"/><path class="ln" d="${line}"/>
    ${pts.filter((_,i)=>i%Math.ceil(pts.length/6)===0||i===pts.length-1).map(p=>`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join('')}
  </svg><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--faint)"><span>${fmtAUD(mn)}</span><span>${fmtAUD(mx)}</span></div>`;
}

function median(a){ if(!a.length)return null; const s=a.slice().sort((x,y)=>x-y),m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }

  const p=DATA.players.find(x=>x.player===name); if(!p)return; const cls=p.score>=85?'gold':p.score>=70?'green':'yellow';
  const listings=DATA.listings.filter(l=>l.player===name);
  const body=`<div class="drawer-head"><div class="top"><span class="pill pill-${cls}">${cls==='gold'?'★ ':''}Marketability ${p.score}</span>
    <button class="drawer-close" onclick="UI.closeDrawer()">×</button></div><h2>${esc(p.player)}</h2>
    <div class="meta">${esc(p.tier||'—')} · momentum ${esc(p.momentum||'—')}</div></div>
    <div class="drawer-body">
      <div class="d-section"><h4>Retained evidence</h4>${(p.ev||[]).map(e=>`<div class="evidence"><div class="src">${esc(e.source||'—')}</div>
        <div class="val">${esc(e.metric||'')}: ${esc(e.value||'')}</div>${e.confidence?`<span class="conf">${esc(e.confidence)}</span>`:''}</div>`).join('')||emptyInline('No retained evidence.')}</div>
      <div class="d-section"><h4>Tracked listings (${listings.length})</h4>${listings.map(l=>`<div class="evidence" style="cursor:pointer" onclick="UI.closeDrawer();openListing('${l.id}')">
        <div class="src">${esc(l.item||'signed shirt')} <span class="pill pill-${vlow(l.verdict)}" style="margin-left:6px">${l.verdict}</span></div>
        <div class="val">${esc(l.platform||'')} · offer ${fmtAUD(l.maxoff)} vs ${fmtAUD(l.mid)} mid · ROI ${pct(l.roi)}</div></div>`).join('')||emptyInline('None tracked.')}</div>
    </div>`;
  showDrawer(body);
}
function openSeller(name){
  const s=DATA.sellers.find(x=>x.name===name); if(!s)return; const risk=(s.risk||'').toLowerCase(); const rp=risk.includes('high')?'red':risk.includes('med')?'yellow':'green';
  const body=`<div class="drawer-head"><div class="top"><span class="pill pill-${rp}">${esc(s.risk||'Risk —')}</span>
    <button class="drawer-close" onclick="UI.closeDrawer()">×</button></div><h2>${esc(s.name)}</h2><div class="meta">${esc(s.platform||'—')}</div></div>
    <div class="drawer-body"><div class="d-section"><h4>Profile</h4><div class="kv">
      <span>Seller score</span><b>${s.score??'—'}</b><span>Feedback</span><b>${esc(s.feedback??'—')}</b>
      <span>Sales count</span><b>${esc(s.sales??'—')}</b><span>Tracked listings</span><b>${esc(s.tracked??0)}</b></div></div>
      ${s.concerns?`<div class="d-section"><h4>Authentication concerns</h4><div class="evidence"><div class="val">${esc(s.concerns)}</div></div></div>`:''}
      <p class="disclaimer">Counterparty risk is one input to the seller-quality weight (5 pts). Not financial advice.</p></div>`;
  showDrawer(body);
}
function showDrawer(html){ const d=$('#drawer'); d.innerHTML=html; d.classList.add('open'); $('#scrim').classList.add('open'); document.body.style.overflow='hidden'; }

/* ---------- wiring ---------- */
function wirePage(){
  $('#main').querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',e=>{ if(e.target.closest('a'))return; openListing(el.dataset.open); }));
  $('#main').querySelectorAll('.hero[data-open]').forEach(el=>el.addEventListener('keydown',e=>{ if(e.key==='Enter')openListing(el.dataset.open); }));
  $('#main').querySelectorAll('[data-player]').forEach(el=>el.onclick=()=>openPlayer(el.dataset.player));
  $('#main').querySelectorAll('[data-seller]').forEach(el=>el.onclick=()=>openSeller(el.dataset.seller));
  // table controls
  $('#main').querySelectorAll('th[data-sort]').forEach(t=>t.onclick=()=>{ const k=t.dataset.sort;
    STATE.sort = STATE.sort.key===k?{key:k,dir:-STATE.sort.dir}:{key:k,dir:k==='player'||k==='platform'?1:-1}; rerenderTable(); });
  $('#main').querySelectorAll('.chip[data-filter]').forEach(c=>c.onclick=()=>{ STATE.filter=c.dataset.filter; rerenderTable(); });
  const ts=$('#tblSearch'); if(ts) ts.oninput=()=>{ STATE.tq=ts.value; const host=$('#tblHost'); if(host){host.innerHTML=listingsTable(DATA.listings); wirePage();} };
}
function rerenderTable(){ const host=$('#tblHost'); if(host){ host.innerHTML=listingsTable(DATA.listings); } else render(); wirePage(); }

/* ---------- UI api ---------- */
const UI = {
  openNav(){ $('#nav').classList.add('open'); }, closeNav(){ $('#nav').classList.remove('open'); },
  toggleTheme(){ const e=document.documentElement; e.dataset.theme=e.dataset.theme==='dark'?'light':'dark'; },
  closeDrawer(){ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); document.body.style.overflow=''; },
  setSys(s){ STATE.sys=s; const dot=$('#sysdot'),lab=$('#sysstate');
    dot.className='dot '+(s==='live'?'live':s==='loading'?'loading':'offline');
    lab.textContent=s==='live'?'Static preview':s==='loading'?'Loading preview':'Offline preview'; render(); },
};
$('#globalSearch').addEventListener('input',e=>{ const q=e.target.value.trim(); if(!q){ if(STATE.page!=='available')return; STATE.tq='';render();return; }
  STATE.page='available'; STATE.tq=q; STATE.filter='All'; renderNav(); render(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') UI.closeDrawer(); });

renderNav(); render();
</script>
</body>
</html>
